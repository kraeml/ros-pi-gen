name: ci

# Thin-Wrapper-Adapter (AGENTS.md, Etappe 4): dieser Workflow ruft
# ausschließlich dieselben Make-Targets auf, die auch lokal laufen
# (siehe README.md, Abschnitt "Was passiert im Hintergrund"). Keine
# Build-/Test-Logik liegt im Workflow selbst.
#
# Umfang dieses Workflows (bewusst eingegrenzt, Headless-only-
# Übergangsregelung, AGENTS.md Etappe 4): CI-Parität für Lint, Setup,
# Build und Test der Variante headless bei jedem Push/PR. Kein
# Release-Trigger, kein S3-Publish, kein GitHub-Release — die
# Produktions-Publish-Logik (S3 status=production, GitHub-Release)
# ist noch nicht implementiert und daher nicht Teil dieses Workflows.
# Gate-2/3-Testveröffentlichungen erfolgen weiterhin ausschließlich
# manuell/lokal über tools/publish-s3.sh (AGENTS.md).

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # make lint führt bereits arm64-Container-Tests aus
      # (test_hostname_ssid.py, debian:trixie), nicht erst make build —
      # ohne registrierten arm64-Interpreter scheitert das auf dem
      # amd64-Runner mit "exec format error".
      - uses: docker/setup-qemu-action@v4
      - run: make venv
      - run: make lint

  build-and-test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Runner-Disk ist knapp (~14 GB frei); der Build braucht work/
      # (~3 GB) + Docker-Schichten + xz-Kompression. Bekannte sichere
      # Räum-Kandidaten vorab entfernen (siehe GitHub-Image-Workflow.md,
      # § 6 — Werte als Näherung, im ersten echten Lauf kalibrieren).
      - name: Disk-Cleanup
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          docker image prune -af || true
          df -h /

      - uses: docker/setup-qemu-action@v4

      - name: Restore nft helper image cache
        id: nft-helper-cache
        uses: actions/cache/restore@v6
        with:
          path: tests/.cache/nft-helper.tar
          key: ${{ runner.os }}-amd64-nft-helper-v1-${{ hashFiles('tests/docker/nft-helper/Dockerfile') }}

      - name: Load cached nft helper image
        if: steps.nft-helper-cache.outputs.cache-hit == 'true'
        run: |
          docker load --input tests/.cache/nft-helper.tar
          docker image inspect ros-pigen-tests-nft:1 >/dev/null

      - name: Build and cache nft helper image
        if: steps.nft-helper-cache.outputs.cache-hit != 'true'
        timeout-minutes: 50
        run: |
          make ensure-nft-helper
          mkdir -p tests/.cache
          docker save --output tests/.cache/nft-helper.tar ros-pigen-tests-nft:1

      - name: Save nft helper image cache
        if: steps.nft-helper-cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v6
        with:
          path: tests/.cache/nft-helper.tar
          key: ${{ steps.nft-helper-cache.outputs.cache-primary-key }}

      - run: make venv

      - name: Setup (headless)
        run: make setup VARIANT=headless

      # RELEASE_BUILD=1 ist Makefile-Default (Quickfix-Stage 04-user-data
      # aus) — wird hier bewusst NICHT überschrieben. GitHub darf niemals
      # mit dem aktiven Testbenutzer robot (RELEASE_BUILD=0) bauen.
      - name: Build (headless)
        run: make build VARIANT=headless

      - name: Test
        run: make test

      - name: Upload build log (immer)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-docker-log
          path: deploy/build-docker.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload image (nur bei Erfolg)
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: headless-image
          path: deploy/image_*-raspberrypi-trixie-custom-lite.img.xz
          retention-days: 7
          if-no-files-found: ignore
